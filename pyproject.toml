[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indexao-core"
version = "2.0.0"
description = "Indexao v2 - Core Reboot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "toml>=0.10.2",
    "pydantic>=2.0.0",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "watchfiles>=0.21.0",
    "meilisearch>=0.28.0",
    "streamlit>=1.30.0"
]

[project.scripts]
indexao = "indexao_core.main:app"
